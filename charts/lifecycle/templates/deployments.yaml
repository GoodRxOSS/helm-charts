{{- if and .Values.sitesPrivate.enabled (not .Values.components.gateway.enabled) }}
{{- fail "sitesPrivate requires the authorization-capable gateway component" }}
{{- end }}
{{- $sitesUiOrigin := .Values.sitesPrivate.uiOrigin }}
{{- if $sitesUiOrigin }}
{{- $parsed := urlParse $sitesUiOrigin }}
{{- $canonical := printf "https://%s" ($parsed.host | lower | trimSuffix ":443") }}
{{- if or (ne $parsed.scheme "https") (not $parsed.host) $parsed.userinfo (ne $sitesUiOrigin $canonical) }}
{{- fail "sitesPrivate.uiOrigin must be a canonical HTTPS origin without credentials, path, query, fragment or trailing slash" }}
{{- end }}
{{- else if .Values.ui.enabled }}
{{- $appUrl := .Values.ui.config.appUrl | default (printf "https://%s.%s" (.Values.global.uiSubDomain | default "ui") .Values.global.domain) }}
{{- $parsed := urlParse $appUrl }}
{{- if and (eq $parsed.scheme "https") $parsed.host (not $parsed.userinfo) }}
{{- $sitesUiOrigin = printf "https://%s" ($parsed.host | lower | trimSuffix ":443") }}
{{- else if .Values.sitesPrivate.enabled }}
{{- fail "ui.config.appUrl must be an HTTPS URL without credentials to derive the trusted Sites UI origin" }}
{{- end }}
{{- end }}
{{- if .Values.sitesPrivate.enabled }}
{{- $_ := required "sitesPrivate.uiOrigin is required when the bundled UI is disabled" $sitesUiOrigin }}
{{- if and .Values.keycloak.enabled (not .Values.keycloak.clients.lifecycleApiPrincipalSync.enabled) }}
{{- fail "sitesPrivate requires the read-only keycloak.clients.lifecycleApiPrincipalSync credential when bundled Keycloak is enabled" }}
{{- end }}
{{- end }}
{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
{{- if and $component.fullnameOverride (ne $component.fullnameOverride "") }}
  name: {{ $component.fullnameOverride }}
{{- else }}
  name: {{ include "..helper.fullname" $ }}-{{ $name }}
{{- end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "..helper.labels" (merge (dict "component" $name) $) | nindent 4 }}
    {{- if $component.extraLabels }}
    {{- range $key, $value := $component.extraLabels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  replicas: {{ $component.deployment.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "..helper.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "..helper.labels" (merge (dict "component" $name) $) | nindent 8 }}
        {{- if $component.extraLabels }}
        {{- range $key, $value := $component.extraLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "..helper.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.global.podSecurityContext | nindent 8 }}
      {{- with $component.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.deployment.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          securityContext:
            {{- toYaml $.Values.global.securityContext | nindent 12 }}
          image: "{{ $.Values.global.image.repository }}:{{ dig "image" "tag" (include "..helper.appVersion" $) $component }}"
          imagePullPolicy: {{ dig "image" "pullPolicy" $.Values.global.image.pullPolicy $component }}
          {{- if $component.container.command }}
          command:
            {{- toYaml $component.container.command | nindent 12 }}
          {{- end }}
          {{- if $component.container.args }}
          args:
            {{- toYaml $component.container.args | nindent 12 }}
          {{- end }}
          env:
            {{- if $.Values.postgres.enabled }}
            - name: APP_DB_HOST
              value: {{ include "..helper.postgresSvcPrefix" $ }}
            - name: APP_DB_PORT
              value: {{ $.Values.postgres.auth.port | default "5432" | quote }}
            - name: APP_DB_USER
              value: {{ $.Values.postgres.auth.username | default "postgres" | quote }}
            - name: APP_DB_NAME
              value: {{ $.Values.postgres.auth.database | default "postgres" | quote }}
            - name: APP_DB_PASSWORD
              valueFrom:
                {{- if $.Values.postgres.auth.existingSecret }}
                secretKeyRef:
                  name: {{ printf "%s" (tpl $.Values.postgres.auth.existingSecret $) }}
                  key: {{ $.Values.postgres.auth.secretKeys.userPasswordKey | default "APP_DB_PASSWORD" | quote }}
                {{- else if $.Values.postgres.auth.password }}
                value: {{ $.Values.postgres.auth.password | default "postgres" | quote }}
                {{- else }}
                value: {{ "postgres" | quote }}
                {{- end }}
            {{- end }}
            {{- if $.Values.externalDatabase.enabled }}
            - name: APP_DB_HOST
              value: {{ $.Values.externalDatabase.host | quote }}
            - name: APP_DB_PORT
              value: {{ $.Values.externalDatabase.port | quote }}
            - name: APP_DB_USER
              value: {{ $.Values.externalDatabase.username | quote }}
            - name: APP_DB_NAME
              value: {{ $.Values.externalDatabase.database | quote }}
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalDatabase.password.secretKeyRef.name | quote }}
                  key: {{ $.Values.externalDatabase.password.secretKeyRef.key | quote }}
            {{- end }}
            {{- if $.Values.redis.enabled }}
            - name: APP_REDIS_HOST
              value: {{ include "..helper.redisSvcPrefix" $ }}
            - name: APP_REDIS_PORT
              value: {{ $.Values.redis.auth.port | default "6379" | quote }}
            - name: APP_REDIS_PASSWORD
              valueFrom:
                {{- if $.Values.redis.auth.existingSecret }}
                secretKeyRef:
                  name: {{ printf "%s" (tpl $.Values.redis.auth.existingSecret $) }}
                  key: {{ $.Values.redis.auth.existingSecretPasswordKey | default "APP_REDIS_PASSWORD" | quote }}
                {{- else if $.Values.redis.auth.password }}
                value: {{ $.Values.redis.auth.password | default "password" | quote }}
                {{- else }}
                value: {{ "password" | quote }}
                {{- end }}
            {{- end }}
            {{- if and (eq $name "web") $.Values.keycloak.enabled $.Values.keycloak.clients.lifecycleApiKeycloakManagement.enabled }}
            - name: KEYCLOAK_MANAGEMENT_CLIENT_ID
              value: {{ $.Values.keycloak.clients.lifecycleApiKeycloakManagement.clientId | quote }}
            - name: KEYCLOAK_MANAGEMENT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ tpl ($.Values.keycloak.clients.lifecycleApiKeycloakManagement.clientSecret.secretKeyRef.name | default (include "..helper.apiKeycloakManagementSecretName" $)) $ | quote }}
                  key: {{ $.Values.keycloak.clients.lifecycleApiKeycloakManagement.clientSecret.secretKeyRef.key | default "clientSecret" | quote }}
            {{- end }}
            {{- if and (or (eq $name "worker") (eq $name "web") (eq $name "gateway")) $.Values.keycloak.enabled $.Values.keycloak.clients.lifecycleApiPrincipalSync.enabled }}
            - name: KEYCLOAK_PRINCIPAL_SYNC_CLIENT_ID
              value: {{ required "keycloak.clients.lifecycleApiPrincipalSync.clientId is required" $.Values.keycloak.clients.lifecycleApiPrincipalSync.clientId | quote }}
            - name: KEYCLOAK_PRINCIPAL_SYNC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ tpl ($.Values.keycloak.clients.lifecycleApiPrincipalSync.clientSecret.secretKeyRef.name | default (include "..helper.apiPrincipalSyncSecretName" $)) $ | quote }}
                  key: {{ $.Values.keycloak.clients.lifecycleApiPrincipalSync.clientSecret.secretKeyRef.key | default "clientSecret" | quote }}
            {{- end }}
            {{- if or (eq $name "web") (eq $name "gateway") }}
            {{- if $.Values.sitesPrivate.enabled }}
            - name: SITES_PRIVATE_ENABLED
              value: "true"
            {{- end }}
            {{- if $sitesUiOrigin }}
            - name: SITES_UI_ORIGIN
              value: {{ $sitesUiOrigin | quote }}
            {{- end }}
            - name: SITES_TRUSTED_PROXY_ADDRESSES
              value: {{ $.Values.sitesPrivate.trustedProxyAddresses | quote }}
            {{- end }}
            {{- range $.Values.global.env }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- else if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- range $.Values.global.extraEnv }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- else if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- range $component.deployment.extraEnv }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- else if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            - name: HELM_RELEASE_NAME
              value: {{ $.Release.Name }}
          envFrom:
          {{- if $.Values.config.enabled }}
            - configMapRef:
              {{- if $.Values.config.fullnameOverride }}
                name: {{ $.Values.config.fullnameOverride }}
              {{- else }}
                name: {{ include "..helper.fullname" $ }}-config
              {{- end }}
          {{- end }}
          {{- if $.Values.secrets.bootstrap.enabled }}
            - secretRef:
              {{- if $.Values.secrets.bootstrap.fullnameOverride }}
                name: {{ $.Values.secrets.bootstrap.fullnameOverride }}
              {{- else }}
                name: {{ include "..helper.fullname" $ }}-bootstrap
              {{- end }}
          {{- end }}
          {{- if $.Values.secrets.common.enabled }}
            - secretRef:
              {{- if $.Values.secrets.common.fullnameOverride }}
                name: {{ $.Values.secrets.common.fullnameOverride }}
              {{- else }}
                name: {{ include "..helper.fullname" $ }}-common
              {{- end }}
          {{- end }}
          {{- if $.Values.secrets.objectStore.enabled }}
            - secretRef:
              {{- if $.Values.secrets.objectStore.fullnameOverride }}
                name: {{ $.Values.secrets.objectStore.fullnameOverride }}
              {{- else }}
                name: {{ include "..helper.objectStoreSecretName" $ }}
              {{- end }}
          {{- end }}
          {{- if $.Values.global.envFrom }}
            {{- toYaml $.Values.global.envFrom | nindent 12 }}
          {{- end }}
          {{- if $component.deployment.envFrom }}
            {{- toYaml $component.deployment.envFrom | nindent 12 }}
          {{- end }}
          ports:
            {{- with $component.deployment.ports }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- with $component.deployment.livenessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- with $component.deployment.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- with $component.deployment.resources }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $component.deployment.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $component.deployment.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
