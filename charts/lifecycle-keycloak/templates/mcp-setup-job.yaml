MCP realm setup.

Configures the realm for the Lifecycle MCP server via the Keycloak admin API:
a `mcp` client scope with an audience mapper bound to the canonical MCP
resource URL, registration of that scope as a realm optional scope, and
(optionally) anonymous Dynamic Client Registration policies.

This intentionally runs as a post-install/post-upgrade hook instead of being
part of the KeycloakRealmImport: realm imports are one-shot (they never update
an existing realm), and declaring `clientScopes` in an import suppresses
Keycloak's built-in default scopes on fresh installs. The admin-API script is
idempotent and works for both fresh installs and existing realms.
*/}}
{{- if .Values.mcp.enabled }}
{{- if not .Values.mcp.resourceUrl }}
{{- fail "mcp.resourceUrl is required when mcp.enabled=true (canonical MCP URL, e.g. https://app.lifecycle.example.com/mcp)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lifecycle-keycloak.fullname" . }}-mcp-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lifecycle-keycloak.labels" (merge (dict "component" "mcp-setup") .) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  mcp-realm-setup.py: |
{{ .Files.Get "files/mcp-realm-setup.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lifecycle-keycloak.fullname" . }}-mcp-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lifecycle-keycloak.labels" (merge (dict "component" "mcp-setup") .) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.mcp.setupJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.mcp.setupJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "lifecycle-keycloak.labels" (merge (dict "component" "mcp-setup") .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mcp-realm-setup
          image: {{ .Values.mcp.setupJob.image | quote }}
          command: ["/bin/sh", "-c"]
          # Values reach the script via env vars only, never shell interpolation.
          args:
            - |
              set -euf
              set -- --keycloak-url "$KEYCLOAK_URL" --realm "$KEYCLOAK_REALM" \
                --admin-user "$KEYCLOAK_ADMIN_USER" --max-clients "$MCP_MAX_CLIENTS"
              # -f (set above) disables globbing so audience URLs aren't pathname-expanded.
              for url in $MCP_RESOURCE_URLS; do set -- "$@" --mcp-resource-url "$url"; done
              [ "$MCP_DCR_ENABLED" != "true" ] || set -- "$@" --enable-anonymous-dcr
              # Keycloak (and the realm import) may still be converging right after install.
              for attempt in $(seq 1 60); do
                if python3 /scripts/mcp-realm-setup.py "$@"; then
                  exit 0
                fi
                echo "mcp realm setup attempt ${attempt} failed; retrying in 10s"
                sleep 10
              done
              echo "mcp realm setup did not converge" >&2
              exit 1
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "lifecycle-keycloak.fullname" . }}-service.{{ .Release.Namespace }}.svc.cluster.local:8080"
            - name: KEYCLOAK_REALM
              value: {{ .Values.realm | quote }}
            - name: MCP_RESOURCE_URLS
              value: {{ prepend .Values.mcp.extraAudiences .Values.mcp.resourceUrl | uniq | join " " | quote }}
            - name: MCP_MAX_CLIENTS
              value: {{ .Values.mcp.dcr.maxClients | quote }}
            - name: MCP_DCR_ENABLED
              value: {{ .Values.mcp.dcr.enabled | quote }}
            {{- $adminSecret := .Values.mcp.setupJob.adminSecret.name | default (include "lifecycle-keycloak.bootstrapAdminSecretName" .) }}
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: {{ .Values.mcp.setupJob.adminSecret.usernameKey | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: {{ .Values.mcp.setupJob.adminSecret.passwordKey | quote }}
          volumeMounts:
            - name: setup-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: setup-script
          configMap:
            name: {{ include "lifecycle-keycloak.fullname" . }}-mcp-setup
{{- end }}
