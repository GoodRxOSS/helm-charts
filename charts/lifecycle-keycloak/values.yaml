nameOverride: ""
fullnameOverride: ""

parentChartName: lifecycle

annotations: {}
extraLabels: {}

realm: lifecycle
realmDisplayName: Lifecycle
hostname: http://localhost:8080
hostnameStrict: true

clients:
  lifecycleCore:
    enabled: true
    clientId: lifecycle-core

  lifecycleUi:
    enabled: true
    url: http://localhost:3000
    clientId: lifecycle-ui
    clientSecret:
      secretKeyRef:
        name:  # fallback to "{{ include "lifecycle-keycloak.lifecycleUiSecretName" . }}"
        key:  # default "clientSecret"

  # Public client for the lfc command-line tool (Authorization Code + PKCE on a
  # localhost loopback redirect, and the OAuth Device Code flow for headless use).
  lifecycleCli:
    enabled: true
    clientId: lifecycle-cli


companyIdp:
  enabled: true
  clientId:  # fallback to "${vault.company_idp_client_id}"
  clientSecret:  # fallback to "${vault.company_idp_client_secret}"
  tokenUrl:  # fallback to "{{ .Values.internalIdp.internalUrl | default .Values.hostname }}/realms/{{ .Values.internalIdp.realm }}/protocol/openid-connect/token"
  authorizationUrl:  # fallback to "{{ .Values.hostname }}/realms/{{ .Values.internalIdp.realm }}/protocol/openid-connect/auth"
  jwksUrl:  # fallback to "{{ .Values.internalIdp.internalUrl | default .Values.hostname }}/realms/{{ .Values.internalIdp.realm }}/protocol/openid-connect/certs"
  logoutUrl:  # fallback to "{{ .Values.hostname }}/realms/{{ .Values.internalIdp.realm }}/protocol/openid-connect/logout"
  issuer:  # fallback to "{{ .Values.hostname }}/realms/{{ .Values.internalIdp.realm }}"

githubIdp:
  enabled: true
  githubJsonFormat: true
  # Applied at first realm import only; to change it on an existing deployment run:
  # kcadm.sh update identity-provider/instances/github -r lifecycle -s "config.defaultScope=..."
  defaultScope: "repo user:email"
  clientId:
    secretKeyRef:
      name:  # fallback to "{{ include "lifecycle-keycloak.githubIdpSecretName" . }}"
      key:  # default "clientId"
  clientSecret:
    secretKeyRef:
      name:  # fallback to "{{ include "lifecycle-keycloak.githubIdpSecretName" . }}"
      key:  # default "clientSecret"

internalIdp:
  realm: internal
  displayName: "Internal SSO"
  internalUrl:
  mapAdminRole: false
  clientId: internal-sso-client
  users:
    bootstrapUser:
      username: lifecycle
      email: lifecycle@example.com
      firstName: Lifecycle
      lastName: Bootstrap
      password: lifecycle
      credsTemp: true

instances: 1

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-dns"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  className: nginx
  tls: false

externalDatabase:
  enabled: false
  vendor: postgres
  host:
  port: 5432
  database: keycloak
  username: keycloak
  password:
    secretKeyRef:
      name:
      key:

secrets:
  bootstrapAdmin:
    enabled: true
    fullnameOverride: ""
    annotations: []
    username: "bootstrap-admin"
    password: ""

  postgres:
    enabled: true
    fullnameOverride: ""
    annotations: []
    adminPassword: ""
    userPassword: ""

  githubIdp:
    enabled: false
    fullnameOverride: ""
    annotations: []
    clientId:
    clientSecret:

  lifecycleUi:
    enabled: true
    fullnameOverride: ""
    annotations: []
    clientSecret:

keycloakPostgres:
  enabled: true
  nameOverride: postgres
  fullnameOverride: ""

  # Values passed directly to the bitnami/postgresql subchart.
  # Refer to Bitnami PostgreSQL chart docs for all options:
  # https://github.com/bitnami/charts/tree/main/bitnami/postgresql

  image:
    repository: bitnamilegacy/postgresql
  auth:
    database: keycloak
    username: keycloak
    existingSecret: '{{ include "lifecycle-keycloak.postgresSecretName" . }}'
    secretKeys:
      adminPasswordKey: "POSTGRES_ADMIN_PASSWORD"
      userPasswordKey: "POSTGRES_USER_PASSWORD"

  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# -- MCP server realm setup: configures a `mcp` client scope whose audience mapper
# binds access tokens to the canonical MCP resource URL, registers it as a realm
# optional scope, and (optionally) enables anonymous Dynamic Client Registration
# policies so MCP clients (Cursor, Claude Code, VS Code, Codex) can self-register.
# Applied via an idempotent post-install/post-upgrade admin-API Job because realm
# imports never update an existing realm.
mcp:
  enabled: false
  # -- Canonical MCP resource URL (required when enabled), e.g. https://app.lifecycle.example.com/mcp.
  # Must equal the MCP_RESOURCE_URL configured on the lifecycle web deployment.
  resourceUrl: ""
  # -- Additional audience URLs when several MCP deployments share this realm
  # (e.g. local in-cluster web and a host dev server).
  extraAudiences: []
  dcr:
    # -- Enable anonymous Dynamic Client Registration (paste-the-URL-only onboarding).
    # Removes the anonymous Trusted Hosts policy and raises the max-clients cap; the
    # consent-required, allowed-scopes and allowed-protocol-mappers policies stay active.
    # Intended for deployments where Keycloak is not reachable from the public internet.
    # NOTE: removing the Trusted Hosts policy is one-way — disabling this later does not
    # recreate it. Export the realm (or the policy component) first if you may want to revert.
    enabled: true
    maxClients: 1000
  setupJob:
    image: python:3.12-alpine
    backoffLimit: 10
